      <stop offset="0%" stop-color="#fff6ea"/>
      <stop offset="100%" stop-color="#f0e2d2"/>
    </linearGradient>
    <linearGradient id="wood" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#d7a277"/>
      <stop offset="100%" stop-color="#a67952"/>
    </linearGradient>
  </defs>
  <rect width="640" height="640" rx="48" fill="url(#sky)"/>
  <circle cx="520" cy="120" r="54" fill="#f4d7a8"/>
  <ellipse cx="320" cy="560" rx="260" ry="46" fill="#e5d3c0"/>
  <g transform="translate(150 210)">
